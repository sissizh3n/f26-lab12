# It should check out the repo, set up Python, install from `requirements-dev.txt`, and run `pytest`.
on: 
  pull_request: 
  push: 
    branches: [main]
jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with: 
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest
